name: Build DGX APK

on:
  push:
    branches:
      - dgx-meu-dia-v1
    paths:
      - 'dgx-android/**'
      - '.github/workflows/dgx-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Detect Android SDK from GitHub runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms" || true
          find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble APK
        working-directory: dgx-android
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -s dgx-android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh dgx-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DGX-Android-APK
          path: dgx-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
